name: Build and Release Stumble Guys 3DS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Toolchain Dependencies
        run: |
          apt-get update && apt-get install -y qrencode wget
          wget https://github.com/3DS-Development/3DS-Tools-Pipeline/releases/download/v1.0/bannertool -O /usr/local/bin/bannertool
          wget https://github.com/3DS-Development/3DS-Tools-Pipeline/releases/download/v1.0/makerom -O /usr/local/bin/makerom
          chmod +x /usr/local/bin/bannertool /usr/local/bin/makerom

      - name: Build 3DSX and CIA
        run: |
          make
          make cia

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            StumbleGuys3DS.3dsx
            StumbleGuys3DS.cia
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate FBI QR Code
        run: |
          CIA_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/StumbleGuys3DS.cia"
          qrencode -o qrcode.png "$CIA_URL"
          echo "QR Code généré pour : $CIA_URL"

      - name: Upload QR Code Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fbi-qrcode
          path: qrcode.png
